name: Validate n8n Workflows

on:
  pull_request:
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'

jobs:
  validate:
    name: Validate Workflow JSON
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run workflow validation
        run: npm run validate
      
      - name: Comment validation results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Workflow validation failed**\n\nPlease check the validation errors in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix the issues in your workflow JSON files.'
            })
