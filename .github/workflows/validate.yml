name: Validate n8n Workflows

on:
  pull_request:
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'
      - 'scripts/verify-import.mjs'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'
      - 'scripts/verify-import.mjs'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    name: Validate Workflow JSON
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts
      
      - name: Run workflow validation (n8n-nodes-base 2.4.5 and 2.15.1)
        run: npm run validate
      
      - name: Verify workflow import structure
        run: npm run verify-import

      - name: Run unit tests
        run: npm run test:unit
