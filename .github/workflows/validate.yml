name: Validate n8n Workflows

on:
  pull_request:
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**/n8n/*.json'
      - 'scripts/validate-workflows.mjs'

jobs:
  validate:
    name: Validate Workflow JSON
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run workflow validation
        run: npm run validate
